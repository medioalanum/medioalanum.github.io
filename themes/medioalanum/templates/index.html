{% extends "base.html" %}{% block content %}<section class="writing-stream"><h1 class="sr-only">Writing</h1>{% for article in articles_page.object_list[:RECENT_ARTICLES_COUNT] %}<article class="post-preview"><h2><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></h2><p class="excerpt">{{ article.summary|striptags }}</p><div class="post-meta"><time datetime="{{ article.date.isoformat() }}">{{ article.locale_date }}</time><span aria-hidden="true">·</span><span>{{ article.category }}</span></div></article>{% endfor %}<a class="all-writing" href="{{ SITEURL }}/archives.html">All writing →</a></section>{% endblock %}
