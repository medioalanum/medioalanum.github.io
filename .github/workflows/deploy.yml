name: Deploy Pelican site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check out Raymatic
        uses: actions/checkout@v5
        with:
          repository: medioalanum/raymatic
          path: raymatic

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Build Raymatic preview
        run: cargo build --locked --release
        working-directory: raymatic

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: uv run --locked pelican content -s publishconf.py

      - name: Build Raymatic copy
        run: |
          ../raymatic/target/release/ray check
          ../raymatic/target/release/ray build
        working-directory: ray

      - name: Add Raymatic copy under /ray
        run: |
          cp -R ray/output output/ray
          mkdir -p output/ray/assets
          cp -R ray/assets/. output/ray/assets/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
