<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/site.css"><title>{{ title }} · medioalanum</title></head><body><header class="site-header shell"><div class="article-author"><span>by</span><img src="https://github.com/medioalanum.png?size=64" alt="Alan Viana"><strong>Alan Viana</strong></div><nav><a href="https://github.com/medioalanum">GitHub</a><a href="https://www.linkedin.com/in/alanviana/">LinkedIn</a><a href="https://hachyderm.io/@medioalanum">Mastodon</a></nav></header><main class="shell"><article class="article"><header class="article-header"><p class="eyebrow">{{ category }}</p><h1>{{ title }}</h1>{% if summary %}<p class="excerpt">{{ summary }}</p>{% endif %}<div class="article-date">{{ display_date }}</div>{% if attributes.tags %}<div class="post-meta tags">{% for tag in attributes.tags %}<span>{{ tag }}</span>{% endfor %}</div>{% endif %}</header><div class="article-body">{{ body }}</div><footer class="article-footer"><a href="/ray/">← Back to writing</a></footer></article></main></body></html>
